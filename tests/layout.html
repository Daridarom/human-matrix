<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Проверка адаптивности Human Matrix</title><style>body{font:16px system-ui;background:#ddd;margin:12px}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}select,button{font:inherit;padding:8px}iframe{display:block;border:1px solid #999;height:800px;background:white}output{font-size:13px}</style><header><label>Ширина <select id="width"><option>320</option><option selected>390</option><option>650</option><option>768</option><option>1024</option></select></label><button id="measure">Проверить ширину</button><output id="result"></output></header><iframe title="Приложение" id="preview" src="../index.html#person" width="390"></iframe><script>const frame=document.getElementById('preview');document.getElementById('width').onchange=e=>frame.style.width=e.target.value+'px';document.getElementById('measure').onclick=()=>{const d=frame.contentDocument;document.getElementById('result').textContent='Экран: '+d.documentElement.clientWidth+'; документ: '+d.documentElement.scrollWidth;};</script></html>
