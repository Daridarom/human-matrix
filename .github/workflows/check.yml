name: Проверка Human Matrix

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Подключить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Установить зависимости
        run: npm ci
      - name: Собрать расчётное ядро
        run: npm run build
      - name: Проверить приложение и тексты
        run: npm test
